<svg viewBox="0 0 160 120" role="img" aria-label="Bronto, long-necked megaherbivore in profile">
  <!-- Vulcan's megaherbivore. Stroke only, no fill, no colour of its own.

       A hazard by mass rather than appetite — Howard's summary is that they
       won't eat you, they'll accidentally step on you. So the drawing is about
       weight: columnar legs planted straight rather than sprung, a body deeper
       than the neck is long, and a head small enough to be an afterthought at
       the end of it. Nothing here is poised to do anything. -->
  <g>
    <!-- far legs -->
    <path d="M66 76 C 65 88, 65 98, 66 106" opacity="0.45"/>
    <path d="M102 80 C 104 92, 103 100, 104 107" opacity="0.45"/>

    <!-- head and neck -->
    <path d="M16 40 C 20 35, 28 34, 33 37 C 36 39, 35 43, 31 45 C 25 46, 18 44, 16 40 Z"/>
    <path d="M20 41 L 22 41"/>
    <path d="M33 41 C 44 44, 54 52, 62 62"/>
    <path d="M31 46 C 42 50, 52 58, 60 68" opacity="0.8"/>

    <!-- body: deeper than it is long -->
    <path d="M62 62 C 74 50, 98 48, 114 56 C 122 60, 126 66, 126 72"/>
    <path d="M60 70 C 72 84, 100 86, 118 80"/>
    <path d="M126 72 C 126 78, 122 82, 118 80"/>

    <!-- tail, carried clear of the ground -->
    <path d="M126 70 C 138 66, 148 58, 157 48"/>
    <path d="M124 76 C 136 74, 146 66, 154 55" opacity="0.7"/>

    <!-- near legs: columns, not springs -->
    <path d="M74 78 C 73 90, 73 100, 75 108"/>
    <path d="M75 108 L 68 110 L 82 110"/>
    <path d="M110 80 C 112 92, 111 101, 113 108"/>
    <path d="M113 108 L 106 110 L 120 110"/>

    <!-- hide, sparse -->
    <g opacity="0.3">
      <path d="M78 54 C 82 58, 82 64, 78 68 M94 52 C 98 57, 98 64, 94 69"/>
      <path d="M110 58 C 113 62, 113 68, 110 72"/>
    </g>
  </g>
</svg>
