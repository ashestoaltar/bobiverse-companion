<svg viewBox="0 0 160 120" role="img" aria-label="Gorilloid, heavy-shouldered knuckle-walker in profile">
  <!-- Delta's apex predator. Same rules as every plate here: stroke only, no
       fill, no colour of its own, drawn as a survey silhouette rather than an
       illustration.

       The load-bearing shape is the weight distribution: shoulders far heavier
       than hips, forelimbs long enough to reach the ground, head carried low
       and forward off a short neck. That is what reads as "gorilloid" without
       drawing a gorilla. Nothing behind the eyes but animal intelligence, which
       is what let Bob arm the Deltans without deciding whose war it was — so
       the face gets a brow and no expression. -->
  <g>
    <!-- far forelimb, behind the chest -->
    <path d="M66 44 C 66 60, 62 78, 57 92 C 55 98, 52 102, 48 104" opacity="0.45"/>
    <path d="M48 104 C 44 105, 43 109, 47 110" opacity="0.45"/>
    <!-- far hind limb -->
    <path d="M108 72 C 111 84, 110 94, 106 101" opacity="0.45"/>

    <!-- head, carried low -->
    <path d="M28 58 C 28 49, 34 44, 43 44 C 52 44, 58 49, 58 57 C 58 65, 52 70, 43 70 C 34 70, 28 66, 28 58 Z"/>
    <path d="M28 60 C 21 60, 18 64, 22 67 C 26 69, 31 68, 33 65"/>
    <path d="M31 51 C 37 47, 49 47, 55 51" opacity="0.65"/>
    <path d="M42 44 C 44 39, 48 38, 52 40" opacity="0.5"/>
    <path d="M35 56 L 37 56"/>
    <path d="M48 56 L 50 56"/>

    <!-- shoulder mass and back: the whole animal is front-weighted -->
    <path d="M56 50 C 64 38, 78 33, 92 37 C 108 41, 118 52, 122 64"/>
    <path d="M122 64 C 124 72, 121 79, 116 82"/>
    <path d="M56 68 C 66 80, 86 85, 106 82"/>

    <!-- near forelimb, reaching the ground -->
    <path d="M78 42 C 80 58, 78 76, 73 92 C 71 99, 67 103, 62 105"/>
    <path d="M62 105 C 57 106, 56 110, 60 111 C 65 112, 68 108, 66 104"/>
    <!-- near hind limb, short by comparison -->
    <path d="M118 70 C 122 82, 121 94, 116 102"/>
    <path d="M116 102 C 110 104, 106 108, 111 110 L 124 110"/>

    <!-- coat, sparse: enough to read as texture without becoming noise -->
    <g opacity="0.3">
      <path d="M76 39 L 73 34 M86 38 L 85 33 M96 41 L 97 36"/>
      <path d="M110 50 L 113 46 M118 58 L 122 55"/>
    </g>
  </g>
</svg>
