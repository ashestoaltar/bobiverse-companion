<svg viewBox="0 0 160 120" role="img" aria-label="Pigoid, boar-shaped game animal braced to charge">
  <!-- Delta's staple game animal. Stroke only, no fill, no colour of its own.

       Drawn braced rather than grazing, because that is the fact the register
       keeps about it: it charges anything that threatens it, which makes it
       reliably suicidal against a set spear, and it never learns. So the head
       is down, the shoulders are loaded and the front legs are planted. The
       silhouette has to stay prey-shaped next to the gorilloid's — mass over
       the shoulders, but short-limbed and low, an animal built to run at
       something rather than to reach for it. -->
  <g>
    <!-- far legs, behind the body -->
    <path d="M64 82 C 63 92, 62 100, 63 106" opacity="0.45"/>
    <path d="M106 86 C 108 95, 107 102, 108 106" opacity="0.45"/>

    <!-- snout and head, carried low -->
    <path d="M18 78 C 14 76, 14 71, 19 69 C 23 68, 27 69, 29 72"/>
    <path d="M29 72 C 29 63, 36 57, 46 56 C 55 55, 61 60, 62 67 C 62 75, 55 81, 45 82 C 35 83, 29 79, 29 72 Z"/>
    <path d="M23 76 C 20 72, 21 67, 25 65" opacity="0.85"/>
    <path d="M43 64 L 45 64"/>
    <path d="M52 55 C 51 49, 55 45, 60 47 C 62 49, 61 54, 57 56"/>

    <!-- shoulder hump, back and belly -->
    <path d="M57 58 C 66 45, 84 41, 101 45 C 116 49, 126 57, 130 66"/>
    <path d="M130 66 C 132 73, 129 80, 124 83"/>
    <path d="M60 80 C 76 89, 100 89, 118 83"/>
    <path d="M130 68 C 137 66, 140 71, 136 74 C 133 76, 131 74, 132 71"/>

    <!-- near legs, planted -->
    <path d="M72 82 C 71 92, 70 100, 72 107"/>
    <path d="M72 107 L 67 109 L 77 109"/>
    <path d="M114 85 C 117 94, 116 102, 118 107"/>
    <path d="M118 107 L 113 109 L 123 109"/>

    <!-- bristles along the hump -->
    <g opacity="0.4">
      <path d="M74 42 L 72 36 M82 40 L 81 34 M90 41 L 90 35 M98 44 L 99 38"/>
    </g>
  </g>
</svg>
