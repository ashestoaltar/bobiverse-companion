<svg viewBox="0 0 160 120" role="img" aria-label="Trout, plain lateral specimen view">
  <!-- The dragons' preferred prey fish on Jabberwocky, and a name Howard
       assigned on sight of a single image without asking anyone. Bridget, who
       had never seen a trout, declined to argue.

       Stroke only, no fill, no colour. This one is deliberately the plainest
       plate in the register: a flat lateral specimen view, evenly finned, no
       drama in the pose. The joke is that a Bob looked at an alien fish and
       filed it under a word from home, and the drawing lands that better by
       being an ordinary fish than by winking at it. The predators get postures;
       this gets a ruler's-eye view. -->
  <g>
    <!-- body -->
    <path d="M30 60 C 46 46, 82 44, 104 58 C 82 74, 46 74, 30 60 Z"/>
    <!-- tail -->
    <path d="M104 58 C 114 52, 124 47, 130 44 C 127 53, 127 67, 130 76 C 124 73, 114 68, 104 62"/>
    <!-- head: eye and gill cover -->
    <path d="M40 57 C 40 55, 43 55, 43 57 C 43 59, 40 59, 40 57 Z"/>
    <path d="M50 50 C 47 57, 47 63, 50 70" opacity="0.7"/>
    <!-- fins, evenly placed: dorsal, adipose, pectoral, pelvic, anal -->
    <path d="M64 46 C 70 38, 80 36, 86 40 C 80 42, 72 44, 64 46" opacity="0.85"/>
    <path d="M92 50 C 95 47, 98 47, 99 49" opacity="0.7"/>
    <path d="M52 64 C 54 70, 58 73, 62 72" opacity="0.6"/>
    <path d="M62 72 C 64 78, 70 80, 74 78" opacity="0.8"/>
    <path d="M84 70 C 86 76, 90 78, 93 76" opacity="0.8"/>
    <!-- lateral line -->
    <path d="M46 60 C 62 62, 82 62, 100 60" opacity="0.45"/>
    <!-- spotting, sparse -->
    <g opacity="0.35">
      <path d="M58 54 L 59 54 M70 52 L 71 52 M82 55 L 83 55 M64 66 L 65 66 M78 67 L 79 67"/>
    </g>
  </g>
</svg>
