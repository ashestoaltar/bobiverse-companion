<svg viewBox="0 0 160 100" role="img" aria-label="Deltan, portrait: large ears, short snout, forward gaze">
  <!-- Stroke only, no fill, no colour of its own, same as every plate here.

       The treatment is deliberately not the bestiary's. Creatures get a side
       profile at 4:3 — a specimen laid out for measurement. People get a
       portrait at 16:10: head and shoulders, three-quarter, eyes front and
       meeting yours. That difference is doing real work. The series is Bob
       working out who counts as a person, and the same anatomical study that
       suits a gorilloid would file a Deltan as livestock. The validator already
       refuses to let one name sit in both registers; the drawings should not
       undo that by the back door.

       Built from what the books give: bat-like ears, a short snouted face, fur,
       and long thin limbs (Bk2 ch65). The ears carry expression in the text, so
       they are the largest thing here. No tool in the hand — the description
       has them working naked stone, and an invented haft would be an invented
       fact. -->
  <g>
    <!-- ears: the feature the text keeps coming back to -->
    <path d="M67 32 C 58 22, 46 16, 40 20 C 38 26, 46 36, 58 42"/>
    <path d="M93 32 C 102 22, 114 16, 120 20 C 122 26, 114 36, 102 42"/>
    <path d="M56 26 C 50 25, 46 23, 43 22" opacity="0.45"/>
    <path d="M104 26 C 110 25, 114 23, 117 22" opacity="0.45"/>

    <!-- skull and short snout -->
    <path d="M80 26 C 90 26, 96 34, 95 44 C 94 52, 88 58, 80 59 C 72 58, 66 52, 65 44 C 64 34, 70 26, 80 26 Z"/>
    <path d="M74 56 C 72 63, 74 69, 80 70 C 86 69, 88 63, 86 56"/>
    <path d="M76 67 C 76 65, 84 65, 84 67 C 84 69, 76 69, 76 67 Z"/>
    <path d="M78 67 L 79 67 M81 67 L 82 67" opacity="0.7"/>

    <!-- eyes, front: a portrait looks back -->
    <path d="M70 42 C 72 40, 75 40, 77 42 C 75 44, 72 44, 70 42 Z"/>
    <path d="M83 42 C 85 40, 88 40, 90 42 C 88 44, 85 44, 83 42 Z"/>
    <path d="M73 42 L 74 42 M86 42 L 87 42"/>
    <path d="M68 36 C 71 34, 75 34, 78 36" opacity="0.55"/>
    <path d="M82 36 C 85 34, 89 34, 92 36" opacity="0.55"/>

    <!-- shoulders, and one long thin arm: the limbs are noted as spidery -->
    <path d="M72 60 C 71 66, 68 71, 64 74"/>
    <path d="M88 60 C 89 66, 92 71, 96 74"/>
    <path d="M40 100 C 46 84, 54 76, 64 74 L 96 74 C 106 76, 114 84, 120 100"/>
    <path d="M62 78 C 52 84, 44 92, 40 100" opacity="0.8"/>

    <!-- fur, sparse -->
    <g opacity="0.3">
      <path d="M70 30 L 68 26 M80 28 L 80 24 M90 30 L 92 26"/>
      <path d="M66 50 L 62 50 M94 50 L 98 50"/>
    </g>
  </g>
</svg>
