<svg viewBox="0 0 160 100" role="img" aria-label="Pav, portrait: tapered muzzle, eye masks, upright with forepaws at the chest">
  <!-- Stroke only, no fill, no colour. Portrait rather than specimen.

       Jacques' first look at them (Bk2 ch63) is unusually precise for this
       series: giant meerkats, about six feet standing, able to walk upright but
       dropping to all fours for any distance, and furry. So the plate takes the
       upright stance — it is the posture the description leads with, and the one
       the Bobs kept seeing them in — with the forepaws held at the chest, which
       is the whole silhouette of the animal being compared to.

       Their name is an accident that stuck: Deltans was taken and Pavonians
       sounded terrible, so Pav for now. Book 4 has Quinlans and Pav sharing the
       same habit of dropping to four legs when there is ground to cover, which
       is the only cross-reference the books draw between two peoples' bodies. -->
  <g>
    <!-- skull and tapered muzzle -->
    <path d="M80 22 C 89 22, 95 29, 95 38 C 95 45, 91 50, 86 53"/>
    <path d="M86 53 C 84 60, 82 66, 80 68 C 78 66, 76 60, 74 53"/>
    <path d="M74 53 C 69 50, 65 45, 65 38 C 65 29, 71 22, 80 22 Z"/>
    <path d="M78 67 C 78 65, 82 65, 82 67 C 82 69, 78 69, 78 67 Z"/>

    <!-- ears: small, round, set low at the sides -->
    <path d="M64 31 C 60 29, 58 32, 60 35 C 62 36, 64 34, 64 32"/>
    <path d="M96 31 C 100 29, 102 32, 100 35 C 98 36, 96 34, 96 32"/>

    <!-- eye masks, the marking the comparison rests on -->
    <path d="M66 37 C 66 33, 71 32, 74 34 C 76 37, 74 41, 70 41 C 67 41, 66 39, 66 37 Z" opacity="0.55"/>
    <path d="M94 37 C 94 33, 89 32, 86 34 C 84 37, 86 41, 90 41 C 93 41, 94 39, 94 37 Z" opacity="0.55"/>
    <path d="M69 37 C 70 35, 72 35, 73 37 C 72 39, 70 39, 69 37 Z"/>
    <path d="M91 37 C 90 35, 88 35, 87 37 C 88 39, 90 39, 91 37 Z"/>

    <!-- upright chest, narrow, and the forepaws held high -->
    <path d="M73 58 C 69 66, 65 78, 63 100"/>
    <path d="M87 58 C 91 66, 95 78, 97 100"/>
    <path d="M74 74 C 70 76, 68 80, 70 84 C 73 85, 76 82, 76 79"/>
    <path d="M86 74 C 90 76, 92 80, 90 84 C 87 85, 84 82, 84 79"/>

    <!-- fur -->
    <g opacity="0.3">
      <path d="M70 26 L 68 22 M80 24 L 80 20 M90 26 L 92 22"/>
      <path d="M67 70 L 63 71 M93 70 L 97 71 M66 84 L 62 86 M94 84 L 98 86"/>
    </g>
  </g>
</svg>
