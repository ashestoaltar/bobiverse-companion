<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holotank 3D spike — not production</title>
  <style>
    :root {
      --void: #0a0704;
      --panel: #120d07;
      --amber: #ffb454;
      --amber-dim: #c29358;
      --ash: #94734a;
      --rule: #5e4b2b;
      --phos: #7ce8a4;
      --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--void); color: var(--amber);
      font-family: var(--mono); font-size: 13px; }
    body { display: grid; grid-template-rows: auto 1fr auto; min-height: 100%; }
    header, footer {
      padding: 10px 14px; border-bottom: 1px solid var(--rule);
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      background: var(--panel);
    }
    footer { border-bottom: 0; border-top: 1px solid var(--rule); color: var(--ash); font-size: 11.5px; }
    h1 { margin: 0; font-size: 14px; font-weight: 500; letter-spacing: .12em; color: var(--amber); }
    .tag { color: var(--phos); letter-spacing: .1em; font-size: 11px; }
    label { color: var(--amber-dim); letter-spacing: .08em; }
    select, button {
      font: inherit; color: var(--phos); background: transparent;
      border: 1px solid var(--phos); padding: 5px 10px; cursor: pointer;
    }
    button:hover { background: var(--phos); color: var(--void); }
    #tank-wrap {
      position: relative; min-height: 0; display: flex;
      border: 1px solid var(--rule); margin: 12px; background: #060402;
    }
    #tank { width: 100%; height: 100%; min-height: 360px; display: block; touch-action: none; }
    #tank.drop { outline: 2px dashed var(--phos); outline-offset: -6px; }
    #status {
      position: absolute; left: 10px; bottom: 10px; right: 10px;
      padding: 8px 10px; background: rgba(10,7,4,.82); border: 1px solid var(--rule);
      color: var(--amber-dim); font-size: 11.5px; line-height: 1.45; pointer-events: none;
    }
    #status[data-ok="1"] { color: var(--phos); border-color: #2a5a3a; }
    code { color: var(--amber-dim); }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header>
    <div>
      <div class="tag">[SPIKE · NOT BOBNET CONSOLE]</div>
      <h1>HOLOTANK 3D — ORBIT TEST</h1>
    </div>
    <div class="row">
      <label for="model">MODEL</label>
      <select id="model">
        <option value="" disabled selected>No GLB in models/ yet — drag one onto the tank</option>
      </select>
      <button type="button" id="reload" title="Reload selected model">RELOAD</button>
    </div>
  </header>

  <div id="tank-wrap">
    <canvas id="tank"></canvas>
    <div id="status">Starting…</div>
  </div>

  <footer>
    Source still for image→3D:
    <code>source/heaven-g1-upload.jpg</code>
    (also .png / full .jpg).
    Drop a <code>.glb</code> onto the tank to preview.
    Steps in <code>README.md</code>. Not wired into production <code>dist/</code>.
  </footer>

  <script type="module">
    import { loadModel } from './viewer.js';

    const sel = document.getElementById('model');
    const reload = document.getElementById('reload');

    function pick(url) {
      if (!url) return;
      loadModel(url);
    }

    sel.addEventListener('change', () => pick(sel.value));
    reload.addEventListener('click', () => pick(sel.value));

    async function refreshList() {
      try {
        const r = await fetch('./models/manifest.json', { cache: 'no-store' });
        if (!r.ok) return;
        const list = await r.json();
        if (!Array.isArray(list) || !list.length) return;
        sel.innerHTML = '';
        for (const item of list) {
          const path = typeof item === 'string' ? item : item.path;
          const label = typeof item === 'string' ? item : (item.label || item.path);
          const opt = document.createElement('option');
          opt.value = path.startsWith('.') || path.startsWith('/') || path.startsWith('blob:')
            ? path
            : `./models/${path.replace(/^models\//, '')}`;
          opt.textContent = label;
          sel.appendChild(opt);
        }
        pick(sel.value);
      } catch (_) { /* no manifest — drag-drop only */ }
    }
    refreshList();
  </script>
</body>
</html>
